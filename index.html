<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
<title>CVP Practice Drill</title>
<style>
  :root {
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --surface-0: #ffffff;
    --surface-1: #f4f5f7;
    --border: #d5d8dd;
    --radius: 6px;
    --text-primary: #1c1f24;
    --text-secondary: #4b5259;
    --text-muted: #8a8f98;
    --text-success: #1a7f37;
    --text-danger: #cf222e;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-0: #14161a;
      --surface-1: #1d2025;
      --border: #33383f;
      --text-primary: #e8e9eb;
      --text-secondary: #b3b8bf;
      --text-muted: #83898f;
      --text-success: #3fb950;
      --text-danger: #f85149;
      --accent: #58a6ff;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: clamp(1.25rem, 6vh, 2.5rem) 1rem calc(1.25rem + env(safe-area-inset-bottom));
    padding-left: max(1rem, env(safe-area-inset-left));
    padding-right: max(1rem, env(safe-area-inset-right));
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: var(--font-sans);
    min-height: 100dvh;
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  textarea, input, button {
    font: inherit;
    color: inherit;
  }
  textarea:focus, input:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    background: var(--surface-1);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    min-height: 44px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    user-select: none;
  }
  button:hover {
    filter: brightness(0.97);
  }
  button:active {
    filter: brightness(0.93);
    transform: translateY(0.5px);
  }
  @media (prefers-color-scheme: dark) {
    button:hover { filter: brightness(1.15); }
    button:active { filter: brightness(1.25); }
  }
  input[type="number"] {
    background: var(--surface-1);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    min-height: 44px;
    touch-action: manipulation;
  }
  textarea {
    touch-action: manipulation;
  }
  @media (hover: none) and (pointer: coarse) {
    .kbd-hint { display: none; }
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
    flex: none;
  }
  .switch input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .switch .track {
    position: absolute;
    inset: 0;
    background: var(--surface-1);
    border: 0.5px solid var(--border);
    border-radius: 999px;
    transition: background-color .15s, border-color .15s;
    pointer-events: none;
  }
  .switch .track::before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 2px;
    top: 2px;
    background: var(--text-muted);
    border-radius: 50%;
    transition: transform .15s, background-color .15s;
  }
  .switch input:checked + .track {
    background: var(--accent);
    border-color: var(--accent);
  }
  .switch input:checked + .track::before {
    transform: translateX(18px);
    background: #fff;
  }
  .switch input:focus-visible + .track {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .difficulty-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
    font-size: 13px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
<h1 class="sr-only">Multi-step CVP calculation drill for credit card products, with scenario context, a distractor variable, a difficulty toggle for risk-adjusted contribution margin problems, and a scratchpad, keyboard operable</h1>
<div style="max-width:560px;margin:0 auto;">
  <div class="difficulty-row">
    <label class="switch">
      <input type="checkbox" id="difficulty" aria-label="Higher difficulty: risk-adjusted contribution margin problems with tiered interchange costs and chargeback rates" />
      <span class="track" aria-hidden="true"></span>
    </label>
    <label for="difficulty" style="cursor:pointer;">Higher difficulty — risk-adjusted CM (tiered interchange + chargeback rate)</label>
  </div>
  <div id="problem" style="font-size:16px;line-height:1.7;margin-bottom:1rem;min-height:100px;"></div>
  <label for="scratch" class="sr-only">Scratchpad</label>
  <textarea id="scratch" inputmode="decimal" placeholder="Scratchpad — work it out here" style="width:100%;min-height:80px;font-family:var(--font-mono);font-size:13px;padding:8px;margin-bottom:0.75rem;resize:vertical;background:var(--surface-1);border:0.5px solid var(--border);border-radius:var(--radius);color:var(--text-primary);"></textarea>
  <div style="display:flex;gap:8px;margin-bottom:0.75rem;">
    <label for="answer" class="sr-only">Final answer</label>
    <input type="number" inputmode="decimal" id="answer" placeholder="Final answer, then Enter" style="flex:1;" />
    <button id="check" type="button">Check <span class="kbd-hint" style="color:var(--text-muted);font-size:12px;">(Enter)</span></button>
  </div>
  <div id="feedback" role="status" style="font-size:14px;min-height:24px;margin-bottom:0.75rem;"></div>
  <button id="next" type="button" style="width:100%;">New problem <span class="kbd-hint" style="color:var(--text-muted);font-size:12px;">(N)</span></button>
</div>
<script>
function r(min,max,step){ step=step||1; const n=Math.floor(Math.random()*((max-min)/step+1)); return min+n*step; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const cards = ['a travel rewards card', 'a cashback card', 'a small business card', 'a student card', 'a premium metal card', 'a co-branded retail card'];
const distractorLines = [
  n => `The team spent $${n} on a marketing campaign this quarter.`,
  n => `Fraud losses came in at $${n} for the period.`,
  n => `${n} applications were rejected during underwriting.`,
  n => `Customer complaints cost the team $${n} in goodwill credits.`,
  n => `The rewards program budget was adjusted by $${n} this year.`
];
function distractor(){ return pick(distractorLines)(r(500,8000,100)); }

const standardTemplates = [
  // annual fee revenue - servicing cost per cardholder -> CM per cardholder -> breakeven cardholders
  () => {
    const card = pick(cards);
    const fee = r(50,450,25), cost = r(15,fee-15,5), holders = r(1000,20000,500);
    const fixed = (fee-cost)*holders;
    return { text: `${card} charges a $${fee} annual fee and costs $${cost} per cardholder to service each year. The program has $${fixed.toLocaleString()} in fixed costs. ${distractor()} How many cardholders are needed to break even?`, answer: holders };
  },
  // CM ratio -> breakeven revenue
  () => {
    const card = pick(cards);
    const fee = r(75,500,25), cost = r(20,fee-20,5);
    const cmRatio = Math.round(((fee-cost)/fee)*100)/100;
    const fixed = r(50000,400000,5000);
    const breakevenRev = Math.round(fixed/cmRatio);
    return { text: `${card} generates $${fee} in fee revenue per cardholder at a $${cost} servicing cost. Fixed program costs run $${fixed.toLocaleString()}. ${distractor()} What is breakeven revenue in dollars, rounded to the nearest dollar?`, answer: breakevenRev };
  },
  // profit from holders, fee, cost, fixed
  () => {
    const card = pick(cards);
    const holders = r(2000,30000,500), fee = r(50,400,10), cost = r(15,fee-15,5), fixed = r(20000,250000,5000);
    const profit = holders*fee - holders*cost - fixed;
    return { text: `${card} has ${holders.toLocaleString()} cardholders, each generating $${fee} in annual fee revenue at a $${cost} servicing cost. Fixed costs are $${fixed.toLocaleString()}. ${distractor()} What is the program's profit?`, answer: profit };
  },
  // target profit -> cardholders needed
  () => {
    const card = pick(cards);
    const cm = r(20,150,5), fixed = r(30000,300000,5000), target = r(10000,150000,5000);
    return { text: `${card} program wants $${target.toLocaleString()} in profit this year. Fixed costs are $${fixed.toLocaleString()}, and CM per cardholder is $${cm}. ${distractor()} How many cardholders are needed to hit that target?`, answer: Math.round((fixed+target)/cm) };
  },
  // total costs & fixed -> servicing cost per cardholder
  () => {
    const card = pick(cards);
    const holders = r(2000,25000,500), cost = r(10,80,2), fixed = r(20000,200000,5000);
    const totalCosts = holders*cost + fixed;
    return { text: `${card} program had total costs of $${totalCosts.toLocaleString()} while serving ${holders.toLocaleString()} cardholders, with $${fixed.toLocaleString()} of that being fixed. ${distractor()} What is the servicing cost per cardholder?`, answer: cost };
  },
  // reverse: breakeven holders + CM -> fixed costs
  () => {
    const card = pick(cards);
    const cm = r(20,150,5), holders = r(1000,20000,500);
    const fixed = cm*holders;
    return { text: `${card} program breaks even at ${holders.toLocaleString()} cardholders with a CM per cardholder of $${cm}. ${distractor()} What are the program's fixed costs?`, answer: fixed };
  },
  // full chain: fee, cost, holders, fixed -> profit
  () => {
    const card = pick(cards);
    const fee = r(60,400,10), cost = r(15,fee-15,5), holders = r(1500,20000,500), fixed = r(20000,200000,5000);
    const cm = fee - cost;
    const profit = cm*holders - fixed;
    return { text: `${card} charges $${fee} per cardholder annually with a $${cost} servicing cost, has ${holders.toLocaleString()} cardholders, and $${fixed.toLocaleString()} in fixed costs. ${distractor()} What is profit?`, answer: profit };
  }
];

// --- Higher-difficulty pool: risk-adjusted contribution margin ---
// Factors in tiered (bracketed) interchange costs plus an expected loss/chargeback
// rate on volume, so "true" CM has to account for risk alongside scale.

function makeTiers(){
  const t1 = r(50000,150000,5000);
  const t2 = t1 + r(100000,250000,5000);
  const rate1 = r(120,190,5);
  const rate2 = Math.max(50, rate1 - r(15,35,5));
  const rate3 = Math.max(30, rate2 - r(15,35,5));
  return { t1, t2, rate1, rate2, rate3 };
}

function tieredInterchangeCost(volume, tiers){
  const band1 = Math.min(volume, tiers.t1);
  const band2 = Math.max(0, Math.min(volume, tiers.t2) - tiers.t1);
  const band3 = Math.max(0, volume - tiers.t2);
  return band1*tiers.rate1/10000 + band2*tiers.rate2/10000 + band3*tiers.rate3/10000;
}

function tiersText(tiers){
  return `${(tiers.rate1/100).toFixed(2)}% on the first $${tiers.t1.toLocaleString()} of monthly volume, `
    + `${(tiers.rate2/100).toFixed(2)}% on the next $${(tiers.t2-tiers.t1).toLocaleString()}, `
    + `and ${(tiers.rate3/100).toFixed(2)}% on volume beyond $${tiers.t2.toLocaleString()}`;
}

function trueCM(volume, revBps, tiers, lossBps, fixed){
  const revenue = volume*revBps/10000;
  const interchangeCost = tieredInterchangeCost(volume, tiers);
  const loss = volume*lossBps/10000;
  return revenue - interchangeCost - loss - fixed;
}

const advancedTemplates = [
  // total true CM in dollars: revenue - tiered interchange - expected loss - fixed
  () => {
    const card = pick(cards);
    const tiers = makeTiers();
    const volume = r(tiers.t1, tiers.t2*3, 5000);
    const revBps = r(220,340,5);
    const lossBps = r(10,45,5);
    const preFixedCM = trueCM(volume, revBps, tiers, lossBps, 0);
    // scale fixed costs off this scenario's own margin so the true CM lands
    // on either side of breakeven, instead of always being deeply negative
    const fixed = preFixedCM > 0 ? Math.round(preFixedCM*r(30,170,5)/100/500)*500 : 0;
    const answer = Math.round(preFixedCM - fixed);
    return { text: `${card} program processes $${volume.toLocaleString()} in transaction volume this month. It earns ${(revBps/100).toFixed(2)}% in processing revenue on total volume. Interchange is tiered: ${tiersText(tiers)}. The expected loss rate from chargebacks and fraud is ${(lossBps/100).toFixed(2)}% of volume. Fixed operating costs are $${fixed.toLocaleString()}. ${distractor()} What is the program's true (risk-adjusted) contribution margin in dollars this month, rounded to the nearest dollar?`, answer };
  },
  // true CM per transaction as volume scales, tiered interchange + loss rate, excludes fixed (CM is per-unit)
  () => {
    const card = pick(cards);
    const tiers = makeTiers();
    const avgTxn = pick([25,50,75,100,150,200,250]);
    const txnCount = r(2000,20000,500);
    const volume = txnCount*avgTxn;
    const revBps = r(220,340,5);
    const lossBps = r(10,45,5);
    const answer = Math.round((trueCM(volume, revBps, tiers, lossBps, 0)/txnCount)*100)/100;
    return { text: `${card} processes ${txnCount.toLocaleString()} transactions this month averaging $${avgTxn} each (total volume $${volume.toLocaleString()}). It earns ${(revBps/100).toFixed(2)}% in processing revenue on volume. Interchange is tiered: ${tiersText(tiers)}. Expected losses from chargebacks and fraud run ${(lossBps/100).toFixed(2)}% of volume. ${distractor()} What is the true (risk-adjusted) contribution margin per transaction, rounded to the nearest cent?`, answer };
  },
  // incremental true CM as volume scales across a tier boundary
  () => {
    const card = pick(cards);
    const tiers = makeTiers();
    const revBps = r(220,340,5);
    const lossBps = r(10,45,5);
    const v1 = r(Math.max(5000, tiers.t1-80000), tiers.t1, 5000);
    const growth = r(50000,200000,5000);
    const v2 = v1 + growth;
    const cm1 = trueCM(v1, revBps, tiers, lossBps, 0);
    const cm2 = trueCM(v2, revBps, tiers, lossBps, 0);
    const answer = Math.round(cm2-cm1);
    return { text: `${card} program is scaling up. This month it processed $${v1.toLocaleString()} in volume; next month it's projected to reach $${v2.toLocaleString()}. It earns ${(revBps/100).toFixed(2)}% in processing revenue on volume. Interchange is tiered: ${tiersText(tiers)}. Expected losses from chargebacks and fraud run ${(lossBps/100).toFixed(2)}% of volume, applied consistently as volume grows. ${distractor()} How much additional true (risk-adjusted) contribution margin, in dollars, does the volume growth generate, rounded to the nearest dollar?`, answer };
  }
];

let current = null;
const answerEl = document.getElementById('answer');
const feedbackEl = document.getElementById('feedback');
const scratchEl = document.getElementById('scratch');
const difficultyEl = document.getElementById('difficulty');

difficultyEl.checked = localStorage.getItem('cvpHigherDifficulty') === '1';
difficultyEl.addEventListener('change', () => {
  localStorage.setItem('cvpHigherDifficulty', difficultyEl.checked ? '1' : '0');
  newProblem();
});

function fmtAnswer(n){
  return Number.isInteger(n) ? n.toLocaleString() : n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function newProblem(){
  const pool = difficultyEl.checked ? advancedTemplates : standardTemplates;
  const t = pool[Math.floor(Math.random()*pool.length)]();
  current = t;
  document.getElementById('problem').textContent = t.text;
  answerEl.value = '';
  scratchEl.value = '';
  feedbackEl.textContent = '';
  answerEl.focus();
}

function checkAnswer(){
  const val = parseFloat(answerEl.value);
  if (isNaN(val)) { feedbackEl.textContent = 'Enter a number.'; feedbackEl.style.color = 'var(--text-secondary)'; return; }
  if (Math.abs(val - current.answer) < 0.005) {
    feedbackEl.textContent = 'Correct. Press N for the next one.';
    feedbackEl.style.color = 'var(--text-success)';
  } else {
    feedbackEl.textContent = `Not quite. Answer: ${fmtAnswer(current.answer)} — press N to continue.`;
    feedbackEl.style.color = 'var(--text-danger)';
  }
}

document.getElementById('check').onclick = checkAnswer;
document.getElementById('next').onclick = newProblem;

answerEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAnswer();
});

document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'n' && document.activeElement !== answerEl && document.activeElement !== scratchEl) {
    e.preventDefault();
    newProblem();
  }
});

newProblem();
</script>
</body>
</html>
